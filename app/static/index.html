<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice RAG — Hacker House Goa</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #03150f;
    --bg2: #06291d;
    --card: #061b13;
    --card2: #082319;
    --yellow: #f2c300;
    --pink: #ff0878;
    --cream: #eee8d4;
    --muted: #89968e;
    --border: rgba(242, 195, 0, 0.22);
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--cream);
    background:
        radial-gradient(
            circle at 12% 12%,
            rgba(242, 195, 0, 0.08),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(255, 8, 120, 0.07),
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #02120c,
            #063422 50%,
            #03150f
        );
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.035;
    background-image:
        radial-gradient(
            rgba(255, 255, 255, 0.8) 0.7px,
            transparent 0.7px
        );
    background-size: 7px 7px;
}

.page {
    min-height: 100vh;
    padding: 14px;
}

.container {
    position: relative;
    width: min(1100px, 100%);
    min-height: calc(100vh - 28px);
    margin: auto;
    padding: 30px;
    overflow: hidden;
    border: 1px solid var(--border);
    background:
        linear-gradient(
            145deg,
            rgba(5, 57, 38, 0.98),
            rgba(3, 23, 15, 0.99)
        );
    box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.65);
}

.container::before {
    content: "";
    position: absolute;
    inset: 9px;
    border: 1px solid rgba(242, 195, 0, 0.08);
    pointer-events: none;
}

.corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border-color: rgba(242, 195, 0, 0.45);
    border-style: solid;
    z-index: 5;
}

.corner.tl {
    top: 15px;
    left: 15px;
    border-width: 2px 0 0 2px;
}

.corner.tr {
    top: 15px;
    right: 15px;
    border-width: 2px 2px 0 0;
}

.corner.bl {
    bottom: 15px;
    left: 15px;
    border-width: 0 0 2px 2px;
}

.corner.br {
    bottom: 15px;
    right: 15px;
    border-width: 0 2px 2px 0;
}

.header {
    position: relative;
    z-index: 4;
    text-align: center;
    animation: fadeDown 0.8s ease;
}

.logo-wrap {
    width: 260px;
    height: 145px;
    margin: 0 auto 2px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.main-logo {
    width: 245px;
    max-width: 100%;
    max-height: 140px;
    height: auto;
    object-fit: contain;
    display: block;
    filter:
        drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35));
    animation: logoFloat 4s ease-in-out infinite;
}

.logo-line {
    width: 105px;
    height: 2px;
    margin: 0 auto 15px;
    background: var(--yellow);
}

.location {
    color: var(--yellow);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 6px;
    margin-bottom: 13px;
}

.title {
    margin: 0;
    color: var(--yellow);
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(42px, 8vw, 76px);
    line-height: 0.86;
    letter-spacing: -4px;
    text-transform: uppercase;
}

.title span {
    color: var(--cream);
}

.pink-line {
    width: 75px;
    height: 4px;
    margin: 17px auto;
    background: var(--pink);
    transform: skewX(-25deg);
}

.subtitle {
    color: var(--cream);
    font-size: 10px;
    letter-spacing: 4px;
    opacity: 0.62;
}

.mic-area {
    position: relative;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 27px;
}

.mic-button {
    position: relative;
    width: 112px;
    height: 112px;
    border: 2px solid var(--yellow);
    border-radius: 50%;
    background:
        radial-gradient(
            circle at 35% 25%,
            #0c6041,
            #052d1e 65%,
            #03180f
        );
    color: var(--yellow);
    font-size: 40px;
    cursor: pointer;
    box-shadow:
        0 0 0 7px rgba(242, 195, 0, 0.05),
        0 18px 38px rgba(0, 0, 0, 0.5);
    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
}

.mic-button::before {
    content: "";
    position: absolute;
    inset: -9px;
    border: 1px solid rgba(242, 195, 0, 0.2);
    border-radius: 50%;
}

.mic-button:hover {
    transform: scale(1.06);
    box-shadow:
        0 0 0 7px rgba(242, 195, 0, 0.08),
        0 0 32px rgba(242, 195, 0, 0.14),
        0 20px 45px rgba(0, 0, 0, 0.55);
}

.mic-button:active {
    transform: scale(0.95);
}

.mic-button.recording {
    color: var(--pink);
    border-color: var(--pink);
    animation: pulse 1.35s infinite;
}

.status {
    min-height: 22px;
    margin-top: 18px;
    color: var(--cream);
    font-size: 14px;
    opacity: 0.82;
    text-align: center;
}

.language {
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
}

.language strong {
    color: var(--yellow);
}

.results {
    position: relative;
    z-index: 4;
    display: grid;
    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);
    gap: 20px;
    margin-top: 34px;
}

.card {
    position: relative;
    min-width: 0;
    height: 310px;
    padding: 21px;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 4px;
    background:
        linear-gradient(
            145deg,
            var(--card2),
            var(--card)
        );
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.02);
    transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}

.card:hover {
    transform: translateY(-3px);
    border-color: rgba(242, 195, 0, 0.4);
    box-shadow:
        0 18px 35px rgba(0, 0, 0, 0.4);
}

.card.question::before,
.card.answer::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 52px;
    height: 4px;
}

.card.question::before {
    background: var(--yellow);
}

.card.answer::before {
    background: var(--pink);
}

.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}

.card-title {
    color: var(--cream);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px;
    font-weight: bold;
    text-transform: uppercase;
}

.card-label {
    padding: 5px 9px;
    border: 1px solid rgba(242, 195, 0, 0.3);
    color: var(--yellow);
    font-size: 8px;
    font-weight: bold;
    letter-spacing: 2px;
}

.answer .card-label {
    color: var(--pink);
    border-color: rgba(255, 8, 120, 0.35);
}

.card-content {
    width: 100%;
    height: 240px;
    min-width: 0;
    padding-right: 10px;
    overflow-y: auto;
    overflow-x: hidden;
    color: #d9d5c5;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    scrollbar-width: thin;
    scrollbar-color: #5b5426 transparent;
}

.card-content::-webkit-scrollbar {
    width: 5px;
}

.card-content::-webkit-scrollbar-track {
    background: transparent;
}

.card-content::-webkit-scrollbar-thumb {
    background: #5b5426;
    border-radius: 10px;
}

.card-content::-webkit-scrollbar-thumb:hover {
    background: var(--yellow);
}

.placeholder {
    color: #59675f;
}

.loading {
    display: flex;
    align-items: center;
    gap: 6px;
}

.loading span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--yellow);
    animation: loading 1s infinite;
}

.loading span:nth-child(2) {
    animation-delay: 0.15s;
}

.loading span:nth-child(3) {
    animation-delay: 0.3s;
}

.footer {
    position: relative;
    z-index: 4;
    margin-top: 25px;
    text-align: center;
    color: var(--yellow);
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 4px;
    opacity: 0.6;
}

@keyframes pulse {
    0% {
        box-shadow:
            0 0 0 7px rgba(255, 8, 120, 0.08),
            0 0 0 0 rgba(255, 8, 120, 0.3);
    }

    50% {
        box-shadow:
            0 0 0 7px rgba(255, 8, 120, 0.08),
            0 0 0 18px rgba(255, 8, 120, 0.04),
            0 0 35px rgba(255, 8, 120, 0.18);
    }

    100% {
        box-shadow:
            0 0 0 7px rgba(255, 8, 120, 0.08),
            0 0 0 0 rgba(255, 8, 120, 0.3);
    }
}

@keyframes logoFloat {
    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }
}

@keyframes loading {
    0%,
    80%,
    100% {
        opacity: 0.25;
        transform: translateY(0);
    }

    40% {
        opacity: 1;
        transform: translateY(-5px);
    }
}

@keyframes fadeDown {
    from {
        opacity: 0;
        transform: translateY(-18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 720px) {

    .page {
        padding: 7px;
    }

    .container {
        padding: 24px 15px;
    }

    .results {
        grid-template-columns: 1fr;
    }

    .card {
        height: 285px;
    }

    .card-content {
        height: 215px;
    }

    .logo-wrap {
        width: 220px;
        height: 125px;
    }

    .main-logo {
        width: 210px;
        max-height: 120px;
    }

    .title {
        font-size: 50px;
    }
}

@media (max-width: 420px) {

    .container {
        padding: 22px 12px;
    }

    .logo-wrap {
        width: 190px;
        height: 110px;
    }

    .main-logo {
        width: 185px;
    }

    .mic-button {
        width: 98px;
        height: 98px;
        font-size: 34px;
    }

    .card {
        height: 270px;
        padding: 17px;
    }

    .card-content {
        height: 200px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="page">

<div class="container">

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="header">

<div class="logo-wrap">
    <img
        src="/static/image.png.svg"
        alt="Hacker House Goa"
        class="main-logo"
    >
</div>

<div class="logo-line"></div>

<div class="location">
    GOA, INDIA
</div>

<h1 class="title">
    VOICE <span>RAG</span>
</h1>

<div class="pink-line"></div>

<div class="subtitle">
    BUILD • SEARCH • ANSWER
</div>

</div>

<div class="mic-area">

<button
    id="mic"
    class="mic-button"
    aria-label="Microphone"
>
    🎤
</button>

<div
    id="status"
    class="status"
>
    Click microphone and speak
</div>

<div class="language">
    Detected language:
    <strong id="language">—</strong>
</div>

</div>

<div class="results">

<div class="card question">

<div class="card-header">

<div class="card-title">
    Question
</div>

<div class="card-label">
    VOICE
</div>

</div>

<div
    id="transcript"
    class="card-content placeholder"
>
    Your question will appear here...
</div>

</div>

<div class="card answer">

<div class="card-header">

<div class="card-title">
    Answer
</div>

<div class="card-label">
    RAG
</div>

</div>

<div
    id="answer"
    class="card-content placeholder"
>
    Your answer will appear here...
</div>

</div>

</div>

<div class="footer">
    HACKER HOUSE GOA • VOICE RAG
</div>

</div>

</div>

<script>

const mic =
    document.getElementById("mic");

const status =
    document.getElementById("status");

const transcript =
    document.getElementById("transcript");

const answer =
    document.getElementById("answer");

const language =
    document.getElementById("language");

let mediaRecorder = null;
let audioChunks = [];
let recording = false;

function getAudioMimeType() {

    const types = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus",
        "audio/ogg"
    ];

    for (const type of types) {

        if (
            MediaRecorder.isTypeSupported(type)
        ) {
            return type;
        }
    }

    return "";
}

function setText(
    element,
    value,
    placeholder
) {

    element.textContent =
        value || placeholder;

    element.classList.toggle(
        "placeholder",
        !value
    );
}

function showLoading(element) {

    element.classList.remove(
        "placeholder"
    );

    element.innerHTML = `
        <div class="loading">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;
}

async function startRecording() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        const mimeType =
            getAudioMimeType();

        if (mimeType) {

            mediaRecorder =
                new MediaRecorder(
                    stream,
                    {
                        mimeType: mimeType
                    }
                );

        } else {

            mediaRecorder =
                new MediaRecorder(stream);
        }

        audioChunks = [];

        mediaRecorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            };

        mediaRecorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "audio/webm"
                        }
                    );

                await transcribeAudio(blob);
            };

        mediaRecorder.start();

        recording = true;

        mic.classList.add(
            "recording"
        );

        mic.textContent = "⏹";

        status.textContent =
            "Listening... speak now.";

        setText(
            transcript,
            "",
            "Your question will appear here..."
        );

        setText(
            answer,
            "",
            "Your answer will appear here..."
        );

        language.textContent = "—";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Microphone permission denied or unavailable.";
    }
}

function stopRecording() {

    if (
        !mediaRecorder ||
        mediaRecorder.state === "inactive"
    ) {
        return;
    }

    recording = false;

    mic.classList.remove(
        "recording"
    );

    mic.textContent = "🎤";

    status.textContent =
        "Uploading audio...";

    mediaRecorder.stop();
}

async function transcribeAudio(blob) {

    try {

        status.textContent =
            "Transcribing with Sarvam...";

        showLoading(transcript);

        let extension = "webm";

        if (
            blob.type.includes("ogg")
        ) {
            extension = "ogg";
        }

        const formData =
            new FormData();

        formData.append(
            "file",
            blob,
            `voice.${extension}`
        );

        const response =
            await fetch(
                "/transcribe",
                {
                    method: "POST",
                    body: formData
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Transcription failed"
            );
        }

        setText(
            transcript,
            data.transcript,
            "Your question will appear here..."
        );

        language.textContent =
            data.language ||
            data.language_code ||
            "Unknown";

        if (!data.transcript) {

            status.textContent =
                "Could not understand the audio.";

            return;
        }

        status.textContent =
            "Searching documents...";

        await askQuestion(
            data.transcript,
            data.language
        );

    } catch (error) {

        console.error(
            "Transcription error:",
            error
        );

        status.textContent =
            "Error: " +
            error.message;
    }
}

async function askQuestion(
    question,
    detectedLanguage
) {

    try {

        status.textContent =
            "Generating answer...";

        showLoading(answer);

        const response =
            await fetch(
                "/ask",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            question:
                                question,

                            language:
                                detectedLanguage
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Answer request failed"
            );
        }

        setText(
            transcript,
            data.transcript ||
            question,
            "Your question will appear here..."
        );

        setText(
            answer,
            data.answer,
            "Your answer will appear here..."
        );

        language.textContent =
            data.language ||
            detectedLanguage ||
            "Unknown";

        status.textContent =
            "Done";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Error: " +
            error.message;
    }
}

mic.onclick = () => {

    if (recording) {
        stopRecording();
    } else {
        startRecording();
    }

};

</script>

</body>
</html>
